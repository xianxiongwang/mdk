name: 'Node Restore Cache'
description: 'Restore Node.js dependencies from cache'

inputs:
  cache-key:
    description: 'Cache key from setup-node step'
    required: true
  node-version:
    description: 'Node.js version (must match node-setup-cache)'
    required: false
    default: '24.x'

runs:
  using: composite
  steps:
    - name: Restore node modules cache
      id: cache-node-modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ inputs.cache-key }}
        restore-keys: |
          node-modules-${{ runner.os }}-${{ inputs.node-version }}-

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
